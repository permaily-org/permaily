{{/* A block of kind action. Written by packages/mail (bun run build) from its components: do not edit. */}}
{{define "action"}}
<table
  align="center"
  width="100%"
  border="0"
  cellpadding="0"
  cellspacing="0"
  role="presentation"
  style="margin:0 0 24px">
  <tbody>
    <tr>
      <td>
        <table role="presentation" width="100%" border="0" cellpadding="0" cellspacing="0">
          <tbody>
            <tr>
              <td class="pm-line" style="border:1px solid #131312;border-radius:2px">
                <a
                  href="{{.URL}}"
                  class="pm-ink"
                  style="color:#131312;text-decoration-line:none;display:block;padding:14px 16px;font-family:ui-monospace, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace;font-size:14px;line-height:20px;text-decoration:none;word-break:break-all"
                  target="_blank"
                  >{{.URL}}</a
                >
              </td>
            </tr>
          </tbody>
        </table>
      </td>
    </tr>
  </tbody>
</table>
{{end}}
