{{/* A block of kind action. Written by packages/mail (bun run build) from its components: do not edit. */}}
{{define "action"}}
<table
  align="center"
  width="100%"
  border="0"
  cellpadding="0"
  cellspacing="0"
  role="presentation"
  style="margin:0 0 24px">
  <tbody>
    <tr>
      <td>
        <table role="presentation" border="0" cellpadding="0" cellspacing="0">
          <tbody>
            <tr>
              <td
                class="pm-fill"
                style="background-color:#131312;border-radius:2px;mso-padding-alt:14px 24px 0">
                <a
                  href="{{.URL}}"
                  class="pm-on-fill"
                  style="line-height:20px;text-decoration:none;display:inline-block;max-width:100%;mso-padding-alt:0px;color:#f6f6f3;font-family:ui-sans-serif, system-ui, -apple-system, &#x27;Segoe UI&#x27;, Roboto, Helvetica, Arial, sans-serif;font-size:16px;font-weight:500;padding:14px 24px;padding-top:14px;padding-right:24px;padding-bottom:14px;padding-left:24px"
                  target="_blank"
                  ><span></span
                  ><span
                    style="max-width:100%;display:inline-block;line-height:120%;mso-padding-alt:0px;mso-text-raise:10.5px"
                    >Sign in</span
                  ><span></span
                ></a>
              </td>
            </tr>
          </tbody>
        </table>
        <p
          class="pm-ink-2"
          style="font-size:13px;line-height:19px;font-family:ui-monospace, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace;color:#5b5b55;margin:12px 0 0;word-break:break-all;overflow-wrap:anywhere;margin-top:12px;margin-right:0;margin-bottom:0;margin-left:0">
          {{.URL}}
        </p>
      </td>
    </tr>
  </tbody>
</table>
{{end}}
