{{/* A block of kind code. Written by packages/mail (bun run build) from its components: do not edit. */}}
{{define "code"}}
<table
  align="center"
  width="100%"
  border="0"
  cellpadding="0"
  cellspacing="0"
  role="presentation"
  class="pm-sunken"
  style="background-color:#ecece7;border-radius:2px;margin:0 0 24px">
  <tbody>
    <tr>
      <td>
        <p
          class="pm-ink pm-code"
          style="font-size:40px;line-height:48px;font-family:ui-monospace, Menlo, Consolas, &#x27;Liberation Mono&#x27;, monospace;font-weight:600;letter-spacing:6px;white-space:nowrap;user-select:all;-webkit-user-select:all;color:#131312;margin:0;padding:20px 24px;margin-top:0;margin-bottom:0;margin-left:0;margin-right:0">
          {{.Text}}
        </p>
      </td>
    </tr>
  </tbody>
</table>
{{end}}
