# AWS Amplify build for the public site (site/). The repo is a monorepo:
# the Amplify app must set the environment variable AMPLIFY_MONOREPO_APP_ROOT=site.
# Production deploys from main; develop can be connected as a preview branch.
version: 1
applications:
  - appRoot: site
    frontend:
      phases:
        preBuild:
          commands:
            # Same bun version as packageManager in site/package.json.
            - curl -fsSL https://bun.sh/install | bash -s "bun-v1.3.13"
            - export PATH="$HOME/.bun/bin:$PATH"
            - bun install --frozen-lockfile
        build:
          commands:
            - export PATH="$HOME/.bun/bin:$PATH"
            - bun run build
            - bun run test
      artifacts:
        baseDirectory: dist
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
    # Security headers are set on the Amplify app (deploy/tofu/site.tf, custom_headers).
