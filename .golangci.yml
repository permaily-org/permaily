version: "2"

linters:
  default: standard
  enable:
    - depguard
    - errorlint
    - gosec
    - misspell
    - revive
    - unconvert
  settings:
    depguard:
      # Layering rules. They grow with the code (see docs/architecture.md).
      rules:
        public-packages:
          # pkg/ is imported by third parties (verifiers): no internal code, no I/O frameworks.
          files: ["**/pkg/**", "!$test", "!**/attestationtest/**"]
          list-mode: lax
          deny:
            - pkg: github.com/permaily-org/permaily/internal
              desc: pkg/ must not depend on internal/
        host-is-untrusted:
          # The parent instance only moves bytes: it must not link enclave code.
          files: ["**/cmd/permaily-host/**", "**/internal/hostproxy/**"]
          list-mode: lax
          deny:
            - pkg: github.com/permaily-org/permaily/internal/nsm
              desc: the host must not touch attestation
            - pkg: github.com/permaily-org/permaily/internal/tlsacme
              desc: TLS keys live only in the enclave
            - pkg: github.com/permaily-org/permaily/internal/webui
              desc: the web app ships only inside the enclave
        contracts-are-leaves:
          # What crosses the boundary is defined once and depends on nothing of the service.
          files: ["**/internal/contracts/**"]
          list-mode: strict
          allow:
            - $gostd
            - github.com/permaily-org/permaily/internal/contracts
        domain-is-pure:
          # Rules that need nothing but their arguments: no storage, no keys, no network.
          files: ["**/internal/domain/**"]
          list-mode: strict
          allow:
            - $gostd
            - github.com/permaily-org/permaily/internal/contracts
            - github.com/permaily-org/permaily/internal/domain
        query-is-pure:
          # The query language (ADR 0027): pure like domain, plus the Unicode and IDNA tables it normalises with.
          # Not $gostd, which holds os, net and io: only what parsing, normalising, hashing and sorting need
          # (entries match as prefixes: unicode also allows unicode/utf8 and unicode/utf16).
          files: ["**/internal/query/**", "!$test", "!**/internal/query/querytest/**"]
          list-mode: strict
          allow:
            - bytes
            - cmp
            - crypto/sha256
            - encoding/base32
            - encoding/json
            - errors
            - fmt
            - maps
            - slices
            - sort
            - strconv
            - strings
            - time
            - unicode
            - github.com/permaily-org/permaily/internal/contracts
            - github.com/permaily-org/permaily/internal/query
            - golang.org/x/text/unicode/norm
            - golang.org/x/net/idna
        decide-is-pure:
          # The one interface to a model (ADR 0028): what is put to it and what comes back, pure like the query
          # language. No net, no io, no os: the provider's client is internal/decide/openai, an adapter.
          files: ["**/internal/decide/*.go", "!$test"]
          list-mode: strict
          allow:
            - bytes
            - context
            - crypto/sha256
            - embed
            - encoding/hex
            - encoding/json
            - errors
            - math
            - slices
            - strings
            - time
            - unicode
            - github.com/permaily-org/permaily/internal/contracts
            - github.com/permaily-org/permaily/internal/decide
            - github.com/permaily-org/permaily/internal/query
        model-client-sees-no-mail-store:
          # The provider's client (ADR 0028) is given one Call and a key, and nothing that reaches stored mail,
          # keys or accounts: what it can leak is what the Call holds.
          files: ["**/internal/decide/openai/**", "!$test"]
          list-mode: lax
          deny:
            - pkg: github.com/permaily-org/permaily/internal/store
              desc: the model's client reaches no storage
            - pkg: github.com/permaily-org/permaily/internal/inbox
              desc: the model's client is given a Call, never a mailbox
            - pkg: github.com/permaily-org/permaily/internal/keys
              desc: the model's client holds no key of the enclave
            - pkg: github.com/permaily-org/permaily/internal/envelope
              desc: the model's client opens nothing sealed
            - pkg: github.com/permaily-org/permaily/internal/services
              desc: the model's client knows no service
            - pkg: github.com/aws/aws-sdk-go-v2
              desc: the model's client reaches only the model
        oauth-is-pure:
          # What the authorization server decides from its arguments alone (ADR 0030): metadata, the rules of a
          # client_id and its document, PKCE, redirects, resources, scopes, token shapes, client assertions.
          # No net/http, no io, no os, no storage: fetching is internal/vendors/cimd's, keeping is the service's.
          files: ["**/internal/oauth/*.go", "!$test"]
          list-mode: strict
          allow:
            - bytes
            - crypto
            - encoding
            - errors
            - fmt
            - math
            - net/netip
            - net/url
            - slices
            - sort
            - strconv
            - strings
            - time
            - unicode
            - github.com/permaily-org/permaily/internal/contracts
            - github.com/permaily-org/permaily/internal/oauth
            - github.com/permaily-org/permaily/internal/jws
            # A pushed request's formula is checked by the language's own parser (ADR 0030, V5); query is pure.
            - github.com/permaily-org/permaily/internal/query
            - golang.org/x/net/idna
        rules-are-pure:
          # The rules every connection's reads apply first (ADR 0031): formulas of the query language, compiled.
          files: ["**/internal/rules/**", "!$test"]
          list-mode: strict
          allow:
            - embed
            - encoding/json
            - errors
            - fmt
            - sync
            - github.com/permaily-org/permaily/internal/contracts
            - github.com/permaily-org/permaily/internal/query
            - github.com/permaily-org/permaily/internal/rules
        vendors-list-is-pure:
          # The verified vendors and the seam that resolves a client (ADR 0030); the fetching adapter is
          # internal/vendors/cimd, outside this rule.
          files: ["**/internal/vendors/*.go", "!$test"]
          list-mode: strict
          allow:
            - context
            - errors
            - strconv
            - strings
            - time
            - github.com/permaily-org/permaily/internal/contracts
            - github.com/permaily-org/permaily/internal/oauth
            - github.com/permaily-org/permaily/internal/vendors
        mcp-sdk-only-in-mcpapi:
          # The MCP Go SDK speaks the protocol and nothing else (ADR 0030): only the MCP adapter links it, behind
          # the service's own token and step-up checks.
          files: ["$all", "!$test", "!**/internal/mcpapi/**"]
          list-mode: lax
          deny:
            - pkg: github.com/modelcontextprotocol/go-sdk
              desc: only internal/mcpapi speaks MCP
        services-know-no-adapter:
          # A service is used by the API, MCP and the command line alike: it knows none of them, and no cloud.
          files: ["**/internal/services/**", "!$test"]
          list-mode: lax
          deny:
            - pkg: net/http
              desc: a service does not know it is behind HTTP
            - pkg: github.com/permaily-org/permaily/internal/httpapi
              desc: a service does not depend on an adapter
            - pkg: github.com/permaily-org/permaily/internal/router
              desc: a service does not depend on an adapter
            - pkg: github.com/permaily-org/permaily/internal/smtpd
              desc: a service does not depend on an adapter
            - pkg: github.com/permaily-org/permaily/internal/webui
              desc: a service does not depend on an adapter
            - pkg: github.com/aws/aws-sdk-go-v2
              desc: a service reaches the cloud through internal/store and internal/keys
        no-fakes-in-production:
          files:
            [
              "$all",
              "!$test",
              "!**/platform_dev.go",
              "!**/internal/nsm/fakensm/**",
              "!**/provenancetest/**",
              "!**/internal/webauthn/webauthntest/**",
              "!**/internal/idp/idptest/**",
              "!**/internal/inbox/inboxtest/**",
              "!**/internal/inbox/disclosetest/**",
              "!**/internal/services/connections/connectionstest/**",
              "!**/internal/services/mailboxes/mailboxestest/**",
              "!**/internal/decide/decidetest/**",
            ]
          list-mode: lax
          deny:
            - pkg: github.com/permaily-org/permaily/internal/nsm/fakensm
              desc: the fake attester is only for dev mode and tests
            - pkg: github.com/permaily-org/permaily/pkg/attestation/attestationtest
              desc: test chains are only for dev mode and tests
            - pkg: github.com/permaily-org/permaily/pkg/provenance/provenancetest
              desc: the test release authority is only for dev mode and tests
            - pkg: github.com/permaily-org/permaily/internal/webauthn/webauthntest
              desc: the software authenticator is only for dev mode and tests
            - pkg: github.com/permaily-org/permaily/internal/idp/idptest
              desc: the fake providers are only for dev mode and tests
            - pkg: github.com/permaily-org/permaily/internal/inbox/inboxtest
              desc: the stand-in for delivery is only for tests
            - pkg: github.com/permaily-org/permaily/internal/inbox/disclosetest
              desc: the stand-in for disclosure's decisions is only for tests
            - pkg: github.com/permaily-org/permaily/internal/services/connections/connectionstest
              desc: the fake connections service is only for tests
            - pkg: github.com/permaily-org/permaily/internal/services/mailboxes/mailboxestest
              desc: the fake mailboxes are only for tests
            - pkg: github.com/permaily-org/permaily/internal/query/querytest
              desc: the generators and the brute force of the query language are only for tests
            - pkg: github.com/permaily-org/permaily/internal/decide/decidetest
              desc: the fake model and its contract are only for tests
    gosec:
      excludes:
        - G104 # unhandled errors are covered by errcheck
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/permaily-org/permaily
