version: "2"

linters:
  default: standard
  enable:
    - depguard
    - errorlint
    - gosec
    - misspell
    - revive
    - unconvert
  settings:
    depguard:
      # Layering rules. They grow with the code (see docs/architecture.md).
      rules:
        public-packages:
          # pkg/ is imported by third parties (verifiers): no internal code, no I/O frameworks.
          files: ["**/pkg/**", "!$test", "!**/attestationtest/**"]
          list-mode: lax
          deny:
            - pkg: github.com/permaily-org/permaily/internal
              desc: pkg/ must not depend on internal/
        host-is-untrusted:
          # The parent instance only moves bytes: it must not link enclave code.
          files: ["**/cmd/permaily-host/**", "**/internal/hostproxy/**"]
          list-mode: lax
          deny:
            - pkg: github.com/permaily-org/permaily/internal/nsm
              desc: the host must not touch attestation
            - pkg: github.com/permaily-org/permaily/internal/tlsacme
              desc: TLS keys live only in the enclave
            - pkg: github.com/permaily-org/permaily/internal/webui
              desc: the web app ships only inside the enclave
        contracts-are-leaves:
          # What crosses the boundary is defined once and depends on nothing of the service.
          files: ["**/internal/contracts/**"]
          list-mode: strict
          allow:
            - $gostd
            - github.com/permaily-org/permaily/internal/contracts
        domain-is-pure:
          # Rules that need nothing but their arguments: no storage, no keys, no network.
          files: ["**/internal/domain/**"]
          list-mode: strict
          allow:
            - $gostd
            - github.com/permaily-org/permaily/internal/contracts
            - github.com/permaily-org/permaily/internal/domain
        services-know-no-adapter:
          # A service is used by the API, MCP and the command line alike: it knows none of them, and no cloud.
          files: ["**/internal/services/**", "!$test"]
          list-mode: lax
          deny:
            - pkg: net/http
              desc: a service does not know it is behind HTTP
            - pkg: github.com/permaily-org/permaily/internal/httpapi
              desc: a service does not depend on an adapter
            - pkg: github.com/permaily-org/permaily/internal/router
              desc: a service does not depend on an adapter
            - pkg: github.com/permaily-org/permaily/internal/smtpd
              desc: a service does not depend on an adapter
            - pkg: github.com/permaily-org/permaily/internal/webui
              desc: a service does not depend on an adapter
            - pkg: github.com/aws/aws-sdk-go-v2
              desc: a service reaches the cloud through internal/store and internal/keys
        no-fakes-in-production:
          files:
            [
              "$all",
              "!$test",
              "!**/platform_dev.go",
              "!**/internal/nsm/fakensm/**",
              "!**/provenancetest/**",
              "!**/internal/webauthn/webauthntest/**",
              "!**/internal/idp/idptest/**",
              "!**/internal/inbox/inboxtest/**",
              "!**/internal/services/mailboxes/mailboxestest/**",
            ]
          list-mode: lax
          deny:
            - pkg: github.com/permaily-org/permaily/internal/nsm/fakensm
              desc: the fake attester is only for dev mode and tests
            - pkg: github.com/permaily-org/permaily/pkg/attestation/attestationtest
              desc: test chains are only for dev mode and tests
            - pkg: github.com/permaily-org/permaily/pkg/provenance/provenancetest
              desc: the test release authority is only for dev mode and tests
            - pkg: github.com/permaily-org/permaily/internal/webauthn/webauthntest
              desc: the software authenticator is only for dev mode and tests
            - pkg: github.com/permaily-org/permaily/internal/idp/idptest
              desc: the fake providers are only for dev mode and tests
            - pkg: github.com/permaily-org/permaily/internal/inbox/inboxtest
              desc: the stand-in for delivery is only for tests
            - pkg: github.com/permaily-org/permaily/internal/services/mailboxes/mailboxestest
              desc: the fake mailboxes are only for tests
    gosec:
      excludes:
        - G104 # unhandled errors are covered by errcheck
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/permaily-org/permaily
