version: "2"

linters:
  default: standard
  enable:
    - depguard
    - errorlint
    - gosec
    - misspell
    - revive
    - unconvert
  settings:
    depguard:
      # Layering rules. They grow with the code (see docs/architecture.md).
      rules:
        public-packages:
          # pkg/ is imported by third parties (verifiers): no internal code, no I/O frameworks.
          files: ["**/pkg/**", "!$test", "!**/attestationtest/**"]
          list-mode: lax
          deny:
            - pkg: github.com/permaily-org/permaily/internal
              desc: pkg/ must not depend on internal/
        host-is-untrusted:
          # The parent instance only moves bytes: it must not link enclave code.
          files: ["**/cmd/permaily-host/**", "**/internal/hostproxy/**"]
          list-mode: lax
          deny:
            - pkg: github.com/permaily-org/permaily/internal/nsm
              desc: the host must not touch attestation
            - pkg: github.com/permaily-org/permaily/internal/tlsacme
              desc: TLS keys live only in the enclave
            - pkg: github.com/permaily-org/permaily/internal/webui
              desc: the web app ships only inside the enclave
        no-fakes-in-production:
          files: ["$all", "!$test", "!**/platform_dev.go", "!**/internal/nsm/fakensm/**"]
          list-mode: lax
          deny:
            - pkg: github.com/permaily-org/permaily/internal/nsm/fakensm
              desc: the fake attester is only for dev mode and tests
            - pkg: github.com/permaily-org/permaily/pkg/attestation/attestationtest
              desc: test chains are only for dev mode and tests
    gosec:
      excludes:
        - G104 # unhandled errors are covered by errcheck
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/permaily-org/permaily
