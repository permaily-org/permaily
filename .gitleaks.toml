[extend]
useDefault = true

# Narrow, line-level exceptions only, each with its reason. Never allowlist a path by itself: a path may only
# narrow a line-level exception further.

[[allowlists]]
description = "the history of deploy/enclave.json carries the public SHA-256 of the test mailbox token (ADR 0009), a field that ADR 0026 removed; the scan reads every commit, so the exception stays for as long as the history does; the token itself was never committed"
regexTarget = "line"
regexes = ['''^\s*"mailbox_token_sha256": "[0-9a-f]{64}",?\s*$''']

[[allowlists]]
description = "deploy/enclave.json carries the public SHA-256 of the admin token that may ask for a handoff (ADR 0013); the token itself is never committed"
regexTarget = "line"
regexes = ['''^\s*"admin_token_sha256": "[0-9a-f]{64}",?\s*$''']

[[allowlists]]
description = "internal/webauthn/testdata/vectors holds public captures of what authenticators and browsers answered, copied from published test suites to check the parser against real devices; a challenge, client data, authenticator data or an origin there is nobody's secret"
condition = "AND"
paths = ['''^internal/webauthn/testdata/vectors/[a-z0-9.-]+\.json$''']
regexTarget = "line"
# The second one is the client data once the scanner has decoded it: it holds the challenge again.
regexes = [
  '''^\s*"(authenticatorData|clientDataJSON|challenge|origin)": "[A-Za-z0-9+/=_:.-]+",?\s*$''',
  '''"type"\s*:\s*"webauthn\.(create|get)"''',
]

[[allowlists]]
description = "the OpenAI client's tests (ADR 0028) send a made-up key, sk-proj-test…, to played providers on the test machine; it was never a key of any OpenAI project, and the scan reads every branch's history"
condition = "AND"
paths = ['''^internal/decide/openai/openai_test\.go$''']
regexTarget = "match"
regexes = ['''^testKey = "sk-proj-test[A-Za-z0-9_-]*"$''']

[[allowlists]]
description = "the model key route's tests (ADR 0028, pull request 4) send a made-up key to played enclaves on the test machine; it was never a key of any OpenAI project"
condition = "AND"
paths = ['''^internal/httpapi/model_test\.go$''']
regexTarget = "match"
regexes = ['''^key = "sk-proj-Ab3dEf6hIj9kLm2nOp5qRs8tUv1wXy4z"$''']

[[allowlists]]
description = "model-key.sh's tests (ADR 0028, pull request 4) send a made-up key to a played enclave on the test machine; it was never a key of any OpenAI project"
condition = "AND"
paths = ['''^scripts/operator-scripts\.test\.ts$''']
regexTarget = "match"
regexes = ['''^key = 'sk-proj-Mk7q2Zr9Wd4Lp1Xn8Tv3'$''']
