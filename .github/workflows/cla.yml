name: cla

# Contributors sign the CLA in docs/contributing.md by commenting on their pull
# request. Signatures are stored in signatures/cla.json on the cla-signatures
# branch. pull_request_target is required to comment on PRs from forks; this
# workflow never checks out or runs the PR's code.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: |
      github.event_name == 'pull_request_target' ||
      github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
    runs-on: ubuntu-24.04
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/permaily-org/permaily/blob/develop/docs/contributing.md#contributor-license-agreement-cla
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: leynier,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >-
            Thanks for your contribution. Before it can be merged, please read the
            [Contributor License Agreement](https://github.com/permaily-org/permaily/blob/develop/docs/contributing.md#contributor-license-agreement-cla)
            and sign it by commenting below with the exact sentence that follows.
          lock-pullrequest-aftermerge: false
