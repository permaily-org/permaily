name: release

# A merge from develop into main builds the enclave image on x86_64 and arm64,
# checks both are identical, attests provenance, and lets semantic-release cut
# a version from the Conventional Commits since the last tag. The tag points at
# the built commit (no release commit), so `scripts/verify.sh <tag>` rebuilds
# exactly the published PCRs.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - run: |
          nix build .#eif --out-link eif -L
          nix build .#permaily-host --out-link host
          nix build .#permaily-verify --out-link verify
          mkdir out
          cp eif/permaily.eif eif/pcrs.json out/
          cp host/bin/permaily-host out/permaily-host-linux-arm64
          arch=$(uname -m | sed 's/x86_64/amd64/; s/aarch64/arm64/')
          cp verify/bin/permaily-verify out/permaily-verify-linux-$arch
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.runner }}
          path: out/

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: x86_64 and arm64 builds are identical
        run: |
          for f in permaily.eif pcrs.json permaily-host-linux-arm64; do
            cmp artifacts/build-ubuntu-24.04/$f artifacts/build-ubuntu-24.04-arm/$f
          done
          mkdir dist
          cp artifacts/build-ubuntu-24.04-arm/* dist/
          cp artifacts/build-ubuntu-24.04/permaily-verify-linux-amd64 dist/
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/pcrs.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bunx semantic-release
      - name: Rebuild the public site with the new release
        env:
          AMPLIFY_RELEASE_WEBHOOK: ${{ secrets.AMPLIFY_RELEASE_WEBHOOK }}
        run: |
          if [ -n "$AMPLIFY_RELEASE_WEBHOOK" ]; then
            curl -sSf --retry 3 -X POST -H "Content-Type: application/json" -d '{}' "$AMPLIFY_RELEASE_WEBHOOK" >/dev/null
          fi

  # After a release, fast-forward develop to main so both point at the same
  # commit (no "main had recent pushes" and a clean next release diff). The
  # permaily-release GitHub App is the only actor allowed to bypass the develop
  # ruleset for this push.
  sync-develop:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: permaily
          permission-contents: write
          permission-workflows: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - name: Fast-forward develop to main
        run: |
          git fetch origin main
          git merge --ff-only origin/main
          git push origin HEAD:develop
