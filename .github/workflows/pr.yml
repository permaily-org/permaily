name: pr

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  # PRs into develop are squash-merged, so the title becomes the commit and
  # drives semantic-release. Lowercase Conventional Commits.
  title:
    if: github.base_ref == 'develop'
    runs-on: ubuntu-24.04
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          subjectPattern: ^[a-z].+$
          subjectPatternError: The subject must start with a lowercase letter.

  # main only receives releases, merged from develop.
  main-source:
    if: github.base_ref == 'main'
    runs-on: ubuntu-24.04
    steps:
      - name: Head branch is develop
        run: |
          if [ "${{ github.head_ref }}" != "develop" ]; then
            echo "Pull requests into main must come from develop (got ${{ github.head_ref }})."
            exit 1
          fi
