name: ci

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-24.04
    # Emulators for the store contract test against the AWS implementation, and a test ACME CA.
    services:
      dynamodb:
        image: amazon/dynamodb-local@sha256:6ada631ec7aa5fc83446855eb17233e3dad184fec47477e8140c6c569cfe0c86
        ports: ["8000:8000"]
      s3:
        image: adobe/s3mock@sha256:ab01a6946750f451ca215a47e91030695b260e4003b8a5a6201d25029b8fca92
        ports: ["9090:9090"]
      # Test ACME CA for internal/tlsacme. It accepts every challenge, so the
      # test exercises registration, orders, finalization and renewal.
      # 2.6.0: later versions omit the Location header golang.org/x/crypto/acme needs.
      pebble:
        image: ghcr.io/letsencrypt/pebble@sha256:18f6e3326ef8b307ce3e97a8c6f00613e318178450a684415e053507ed1f740f # 2.6.0
        ports: ["14000:14000"]
        env:
          PEBBLE_VA_ALWAYS_VALID: "1"
          PEBBLE_VA_NOSLEEP: "1"
          PEBBLE_WFE_NONCEREJECT: "0"
    env:
      PERMAILY_TEST_DYNAMODB: http://localhost:8000
      PERMAILY_TEST_S3: http://localhost:9090
      PERMAILY_TEST_ACME: https://localhost:14000/dir
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # A Sigstore deadline that needs a release deployed makes everything
      # else wait (scripts/sigstore-alarm.sh opens and closes it).
      - name: No Sigstore deadline is waiting for a deployment
        if: github.event_name == 'pull_request' && github.base_ref == 'develop'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.head_ref }}
        run: scripts/check-sigstore-deadline.sh "$HEAD"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      # The TUF root compiled in is the anchor of every later update: a change
      # to it must be exactly what Sigstore publishes and the base accepts.
      # Changes enter through develop, so that is where they are checked.
      - name: A change to the compiled-in trust root is one Sigstore published
        if: github.event_name == 'pull_request' && github.base_ref == 'develop'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch -q --depth=1 origin "$BASE"
          scripts/check-trust-root-change.sh "origin/$BASE"
      - run: go vet ./... && go vet -tags dev ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - run: golangci-lint run --build-tags dev ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Tests with coverage thresholds
        run: scripts/check-coverage.sh
      - run: go test -race ./...
      - name: End to end in dev mode (SMTP to API)
        run: go test -race -tags dev ./cmd/permaily-enclave
      - name: Fuzz the parsers (attestation, KMS policy, release bundles, CMS, mail)
        # A number of executions, not a duration: Go's fuzzer sometimes fails with
        # "context deadline exceeded" when a time limit ends mid-execution.
        run: |
          go test -run='^$' -fuzz=FuzzVerify -fuzztime=500000x ./pkg/attestation
          go test -run='^$' -fuzz=FuzzParsePCRFile -fuzztime=400000x ./pkg/attestation
          go test -run='^$' -fuzz=FuzzAnalyze -fuzztime=1000000x ./pkg/kmspolicy
          go test -run='^$' -fuzz='^FuzzVerify$' -fuzztime=300000x ./pkg/provenance
          go test -run='^$' -fuzz='^FuzzVerifyRekor2$' -fuzztime=200000x ./pkg/provenance
          go test -run='^$' -fuzz='^FuzzTimestamp$' -fuzztime=300000x ./pkg/provenance
          go test -run='^$' -fuzz='^FuzzTrustUpdate$' -fuzztime=200000x ./pkg/provenance
          go test -run='^$' -fuzz=FuzzCMS -fuzztime=500000x ./internal/keys
          go test -run='^$' -fuzz=FuzzParse -fuzztime=150000x ./internal/inbox

  # pkg/provenance verifies release bundles with the standard library, inside
  # the enclave. Here it must give the same answers as sigstore-go, which lives
  # in its own module so its dependencies never reach the image.
  sigstore-differential:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tests/sigstore-differential
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tests/sigstore-differential/go.mod
          cache-dependency-path: tests/sigstore-differential/go.sum
      - run: test -z "$(gofmt -l .)" && go vet ./...
      - run: go test -count=1 ./...

  repo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13 # same as nixpkgs in flake.lock
      - run: bun install --frozen-lockfile
      - run: cd web && bun install --frozen-lockfile
      - run: cd site && bun install --frozen-lockfile
      - name: Biome (lint and format)
        run: bun run lint
      - run: bun scripts/check-design-system.ts
      - run: bun scripts/check-skills.ts
      - name: Third-party notices and license allowlist
        run: bun scripts/third-party-notices.ts --check
      - name: Release notes render with the configured preset
        run: node scripts/check-release-notes.mjs

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run build

  site:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - name: Content tests on the built pages
        run: bun run test
      - run: npx playwright install --with-deps chromium
      - name: Accessibility (axe, WCAG 2.2 AA) and CSP in a real browser
        run: bun run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: site-playwright-traces
          path: site/test-results/

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (pinned by version and SHA-256)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=8.30.1
          # Authenticated API download: the anonymous release URL returns 504 at times.
          gh release download "v${v}" --repo gitleaks/gitleaks --pattern "gitleaks_${v}_linux_x64.tar.gz" --output gitleaks.tgz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .

  # Build the enclave image natively on arm64 and cross-compiled on x86_64.
  # Both must produce the same bytes; the reproducible job compares them.
  eif:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - run: nix build .#eif .#eif-staging -L
      - run: |
          mkdir out
          cp result/pcrs.json result/SHA256SUMS out/
          cp result-1/pcrs.json out/pcrs-staging.json
          # Per-component hashes, to locate any cross-architecture difference.
          nix build .#permaily-enclave --out-link bin
          nix build .#web --out-link web-dist
          {
            sha256sum bin/bin/permaily-enclave | sed 's| .*| permaily-enclave|'
            (cd web-dist && find . -type f | sort | xargs sha256sum)
          } > out/components.txt
          cp bin/bin/permaily-enclave out/permaily-enclave.bin
          cat out/*.txt out/*.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eif-${{ matrix.runner }}
          path: out/

  reproducible:
    needs: eif
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      - name: x86_64 and arm64 builds are identical
        run: |
          for f in components.txt pcrs.json pcrs-staging.json SHA256SUMS; do
            diff -u eif-ubuntu-24.04/$f eif-ubuntu-24.04-arm/$f || failed=1
          done
          [ -z "$failed" ]
          echo "PCRs reproduced across architectures:"
          cat eif-ubuntu-24.04/pcrs.json
