name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./... && go vet -tags dev ./...
      - run: go test -race ./...

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13 # same as nixpkgs in flake.lock
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run build

  # Build the enclave image natively on arm64 and cross-compiled on x86_64.
  # Both must produce the same bytes; the reproducible job compares them.
  eif:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - run: nix build .#eif .#eif-staging -L
      - run: |
          mkdir out
          cp result/pcrs.json result/SHA256SUMS out/
          cp result-1/pcrs.json out/pcrs-staging.json
          # Per-component hashes, to locate any cross-architecture difference.
          nix build .#permaily-enclave --out-link bin
          nix build .#web --out-link web-dist
          {
            sha256sum bin/bin/permaily-enclave | sed 's| .*| permaily-enclave|'
            (cd web-dist && find . -type f | sort | xargs sha256sum)
          } > out/components.txt
          cat out/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eif-${{ matrix.runner }}
          path: out/

  reproducible:
    needs: eif
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      - name: x86_64 and arm64 builds are identical
        run: |
          for f in components.txt pcrs.json pcrs-staging.json SHA256SUMS; do
            diff -u eif-ubuntu-24.04/$f eif-ubuntu-24.04-arm/$f || failed=1
          done
          [ -z "$failed" ]
          echo "PCRs reproduced across architectures:"
          cat eif-ubuntu-24.04/pcrs.json
