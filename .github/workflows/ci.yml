name: ci

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The required check of the Go code: it fails unless every Go job below
  # passed (the checks, the race tests and every fuzz group), so the check's
  # name stays one while the work runs in parallel.
  go:
    if: always()
    needs: [go-checks, go-race, fuzz]
    runs-on: ubuntu-24.04
    steps:
      - name: Every Go job passed
        env:
          CHECKS: ${{ needs.go-checks.result }}
          RACE: ${{ needs.go-race.result }}
          FUZZ: ${{ needs.fuzz.result }}
        run: |
          echo "checks: $CHECKS, race: $RACE, fuzz: $FUZZ"
          [ "$CHECKS" = success ] && [ "$RACE" = success ] && [ "$FUZZ" = success ]

  go-checks:
    runs-on: ubuntu-24.04
    # Emulators for the store contract test against the AWS implementation, and a test ACME CA.
    services:
      dynamodb:
        image: amazon/dynamodb-local@sha256:6ada631ec7aa5fc83446855eb17233e3dad184fec47477e8140c6c569cfe0c86
        ports: ["8000:8000"]
      s3:
        image: adobe/s3mock@sha256:ab01a6946750f451ca215a47e91030695b260e4003b8a5a6201d25029b8fca92
        ports: ["9090:9090"]
      # Test ACME CA for internal/tlsacme. It accepts every challenge, so the
      # test exercises registration, orders, finalization and renewal.
      # 2.6.0: later versions omit the Location header golang.org/x/crypto/acme needs.
      pebble:
        image: ghcr.io/letsencrypt/pebble@sha256:18f6e3326ef8b307ce3e97a8c6f00613e318178450a684415e053507ed1f740f # 2.6.0
        ports: ["14000:14000"]
        env:
          PEBBLE_VA_ALWAYS_VALID: "1"
          PEBBLE_VA_NOSLEEP: "1"
          PEBBLE_WFE_NONCEREJECT: "0"
    env:
      PERMAILY_TEST_DYNAMODB: http://localhost:8000
      PERMAILY_TEST_S3: http://localhost:9090
      PERMAILY_TEST_ACME: https://localhost:14000/dir
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      # A Sigstore deadline that needs a release deployed makes everything
      # else wait (scripts/sigstore-alarm.sh opens and closes it).
      - name: No Sigstore deadline is waiting for a deployment
        if: github.event_name == 'pull_request' && github.base_ref == 'develop'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD: ${{ github.head_ref }}
        run: scripts/check-sigstore-deadline.sh "$HEAD"
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      # The TUF root compiled in is the anchor of every later update: a change
      # to it must be exactly what Sigstore publishes and the base accepts.
      # Changes enter through develop, so that is where they are checked.
      - name: A change to the compiled-in trust root is one Sigstore published
        if: github.event_name == 'pull_request' && github.base_ref == 'develop'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch -q --depth=1 origin "$BASE"
          scripts/check-trust-root-change.sh "origin/$BASE"
      - run: go vet ./... && go vet -tags dev ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0
      - run: golangci-lint run --build-tags dev ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Tests with coverage thresholds
        run: scripts/check-coverage.sh

  # The tests again under the race detector, beside the checks.
  go-race:
    runs-on: ubuntu-24.04
    # Emulators for the store contract test against the AWS implementation, and a test ACME CA.
    services:
      dynamodb:
        image: amazon/dynamodb-local@sha256:6ada631ec7aa5fc83446855eb17233e3dad184fec47477e8140c6c569cfe0c86
        ports: ["8000:8000"]
      s3:
        image: adobe/s3mock@sha256:ab01a6946750f451ca215a47e91030695b260e4003b8a5a6201d25029b8fca92
        ports: ["9090:9090"]
      # Test ACME CA for internal/tlsacme. It accepts every challenge, so the
      # test exercises registration, orders, finalization and renewal.
      # 2.6.0: later versions omit the Location header golang.org/x/crypto/acme needs.
      pebble:
        image: ghcr.io/letsencrypt/pebble@sha256:18f6e3326ef8b307ce3e97a8c6f00613e318178450a684415e053507ed1f740f # 2.6.0
        ports: ["14000:14000"]
        env:
          PEBBLE_VA_ALWAYS_VALID: "1"
          PEBBLE_VA_NOSLEEP: "1"
          PEBBLE_WFE_NONCEREJECT: "0"
    env:
      PERMAILY_TEST_DYNAMODB: http://localhost:8000
      PERMAILY_TEST_S3: http://localhost:9090
      PERMAILY_TEST_ACME: https://localhost:14000/dir
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - name: End to end in dev mode (SMTP to API)
        run: go test -race -tags dev ./cmd/permaily-enclave

  # The parsers fuzzed (attestation, KMS policy, release bundles, CMS, mail,
  # mail's HTML, the query language, redaction): every target of scripts/fuzz.sh, one
  # group a leg, each with its number of executions.
  fuzz-group:
    name: fuzz ${{ matrix.group }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        group: [verify, accounts, mailhtml, query-a, query-b, redact]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - name: The matrix runs every group of scripts/fuzz.sh
        env:
          LEGS: ${{ strategy.job-total }}
        run: test "$(scripts/fuzz.sh --groups | wc -l)" -eq "$LEGS"
      - name: Fuzz group ${{ matrix.group }}
        env:
          GROUP: ${{ matrix.group }}
        run: scripts/fuzz.sh "$GROUP"

  # One check for every fuzz group, so its name stays one as groups change.
  fuzz:
    if: always()
    needs: fuzz-group
    runs-on: ubuntu-24.04
    steps:
      - name: Every fuzz group passed
        env:
          RESULT: ${{ needs.fuzz-group.result }}
        run: |
          echo "fuzz groups: $RESULT"
          [ "$RESULT" = success ]

  # pkg/provenance verifies release bundles with the standard library, inside
  # the enclave. Here it must give the same answers as sigstore-go, which lives
  # in its own module so its dependencies never reach the image.
  sigstore-differential:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tests/sigstore-differential
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: tests/sigstore-differential/go.mod
          cache-dependency-path: tests/sigstore-differential/go.sum
      - run: test -z "$(gofmt -l .)" && go vet ./...
      - run: go test -count=1 ./...

  # internal/webauthn checks passkeys with this repository's own code, inside
  # the enclave. Here it must give the same answers as go-webauthn, which lives
  # in its own module so its dependencies never reach the image; where the two
  # differ on purpose, the test says so case by case.
  webauthn-differential:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tests/webauthn-differential
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: tests/webauthn-differential/go.mod
          cache-dependency-path: tests/webauthn-differential/go.sum
      - run: test -z "$(gofmt -l .)" && go vet ./...
      - run: go test -count=1 ./...

  # internal/idp checks the ID tokens of Google and Microsoft with this
  # repository's own code, inside the enclave. Here it must give the same
  # answers as go-oidc, which lives in its own module so its dependencies
  # never reach the image; where the two differ on purpose, the test says so
  # case by case.
  idp-differential:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tests/idp-differential
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: tests/idp-differential/go.mod
          cache-dependency-path: tests/idp-differential/go.sum
      - run: test -z "$(gofmt -l .)" && go vet ./...
      - run: go test -count=1 ./...

  # internal/oauth is the authorization server's core, written here, inside
  # the enclave. Here x/oauth2 and the MCP SDK's client drive a minimal server
  # made of its functions, and internal/jws must give go-jose's answers; the
  # libraries live in their own module so they never reach the image.
  oauth-differential:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tests/oauth-differential
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: tests/oauth-differential/go.mod
          cache-dependency-path: tests/oauth-differential/go.sum
      - run: test -z "$(gofmt -l .)" && go vet ./...
      - run: go test -count=1 ./...

  # ADR 0042's providers spike: a simulated Graph, go-imap's wire transcripts
  # and the harness's offline guards. Its own module, never imported or
  # deployed; no test calls a real provider.
  providers-spike:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: spikes/providers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: spikes/providers/go.mod
          cache-dependency-path: spikes/providers/go.sum
      - run: test -z "$(gofmt -l .)" && go vet ./...
      - run: go test -count=1 -race ./...

  repo:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13 # same as nixpkgs in flake.lock
      - run: bun install --frozen-lockfile
      - run: cd web && bun install --frozen-lockfile
      - run: cd site && bun install --frozen-lockfile
      - run: cd packages/mail && bun install --frozen-lockfile
      - name: Biome (lint and format)
        run: bun run lint
      - run: bun scripts/check-design-system.ts
      - run: bun scripts/check-skills.ts
      - name: Third-party notices and license allowlist
        run: bun scripts/third-party-notices.ts --check
      - run: bun test scripts/
      # With the drift check's OpenTofu (deploy/drift/Dockerfile), in this
      # checkout and in the layout the drift check plans (only deploy/).
      - name: OpenTofu fmt and validate, here and in the drift check's layout
        run: |
          image=$(grep -o 'ghcr.io/opentofu/opentofu:[^ ]*' deploy/drift/Dockerfile)
          container=$(docker create "$image" /usr/local/bin/tofu)
          docker cp "$container:/usr/local/bin/tofu" "$RUNNER_TEMP/tofu"
          docker rm "$container"
          TOFU=$RUNNER_TEMP/tofu scripts/tofu-validate.sh
      - name: Mail templates are what packages/mail makes, and its tests and types
        working-directory: packages/mail
        run: bun run check && bun run test && bun run typecheck
      - name: Release notes render with the configured preset
        run: node scripts/check-release-notes.mjs

  # The required check of the web app: it fails unless its tests passed, in jsdom and in a real browser, so the
  # check's name stays one while the work runs in parallel.
  web:
    if: always()
    needs: [web-unit, web-e2e]
    runs-on: ubuntu-24.04
    steps:
      - name: Every web job passed
        env:
          UNIT: ${{ needs.web-unit.result }}
          E2E: ${{ needs.web-e2e.result }}
        run: |
          echo "unit: $UNIT, e2e: $E2E"
          [ "$UNIT" = success ] && [ "$E2E" = success ]

  web-unit:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Unit and component tests, with axe and coverage thresholds
        run: bun run test

  # ADR 0030, V63: the consent screen in Chromium, against a played vendor on another site and the API played in the
  # browser, twice: on the app's dev server (the hand-off's flows), and on the built app behind the enclave's own
  # router, app host and SPA handler (web/tests/e2e/server: headers, framing, the paths it serves, opening a page
  # directly). Its own lockfile keeps the web app's dependencies, which Nix hashes, unchanged.
  web-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: cd web && bun install --frozen-lockfile
      - run: cd web/tests/e2e && bun install --frozen-lockfile && bun run typecheck
      - run: cd web/tests/e2e && npx playwright install --with-deps chromium
      - name: The consent screen in Chromium, on the dev server and as the enclave serves it
        run: cd web/tests/e2e && bun run test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: web-e2e-traces
          path: web/tests/e2e/test-results/

  site:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - name: Content tests on the built pages
        run: bun run test
      - run: npx playwright install --with-deps chromium
      - name: Accessibility (axe, WCAG 2.2 AA) and CSP in a real browser
        run: bun run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: site-playwright-traces
          path: site/test-results/

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (pinned by version and SHA-256)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=8.30.1
          # Authenticated API download: the anonymous release URL returns 504 at times.
          gh release download "v${v}" --repo gitleaks/gitleaks --pattern "gitleaks_${v}_linux_x64.tar.gz" --output gitleaks.tgz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          # The history being checked (a pull request's merge with its base, or the branch
          # pushed), every commit of it: not every branch fetched, so a pull request is
          # judged on its own commits; each branch is scanned in its own pull request.
          ./gitleaks git --redact --no-banner --exit-code 1 --log-opts=HEAD .

  # Build the enclave image natively on arm64 and cross-compiled on x86_64.
  # Both must produce the same bytes; the reproducible job compares them.
  eif:
    strategy:
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
      - run: nix build .#eif .#eif-staging -L
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - name: The image's third-party programs are the ones nix/aws-blobs.json describes
        run: bun scripts/image-inventory.ts result/permaily.eif result-1/permaily.eif
      - run: |
          mkdir out
          cp result/pcrs.json result/SHA256SUMS out/
          cp result-1/pcrs.json out/pcrs-staging.json
          # Per-component hashes, to locate any cross-architecture difference.
          nix build .#permaily-enclave --out-link bin
          nix build .#web --out-link web-dist
          {
            sha256sum bin/bin/permaily-enclave | sed 's| .*| permaily-enclave|'
            (cd web-dist && find . -type f | sort | xargs sha256sum)
          } > out/components.txt
          cp bin/bin/permaily-enclave out/permaily-enclave.bin
          cat out/*.txt out/*.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eif-${{ matrix.runner }}
          path: out/

  reproducible:
    needs: eif
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      - name: x86_64 and arm64 builds are identical
        run: |
          for f in components.txt pcrs.json pcrs-staging.json SHA256SUMS; do
            diff -u eif-ubuntu-24.04/$f eif-ubuntu-24.04-arm/$f || failed=1
          done
          [ -z "$failed" ]
          echo "PCRs reproduced across architectures:"
          cat eif-ubuntu-24.04/pcrs.json

  # ADR 0026, "Tests", 26 to 31: the hostile corpus and the frame in real browsers, each on a Docker network with
  # no route out (tests/message-frame/run.sh). Its own lockfile keeps the web app's dependencies, which Nix
  # hashes, unchanged.
  message-frame:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.13
      - run: cd web && bun install --frozen-lockfile && bun run build
      - run: cd tests/message-frame && bun install --frozen-lockfile && bun run typecheck
      - name: The corpus twice and the frame, in ${{ matrix.browser }}
        run: tests/message-frame/run.sh ${{ matrix.browser }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: message-frame-${{ matrix.browser }}-traces
          path: tests/message-frame/test-results/
