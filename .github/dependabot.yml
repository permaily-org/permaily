version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    target-branch: develop
    schedule: { interval: weekly }
    commit-message: { prefix: build }
    groups:
      go: { patterns: ["*"] }
  - package-ecosystem: bun
    directories: [/, /web, /site]
    target-branch: develop
    schedule: { interval: weekly }
    commit-message: { prefix: build }
    groups:
      js: { patterns: ["*"] }
    ignore:
      # astro check does not support TypeScript 7 yet (site/). The web app is already on 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # v10 needs conventional-changelog-writer 9, newer than semantic-release 25 bundles
      # (scripts/check-release-notes.mjs catches it).
      - dependency-name: conventional-changelog-conventionalcommits
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule: { interval: weekly }
    commit-message: { prefix: ci }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: terraform
    directory: /deploy/tofu
    target-branch: develop
    schedule: { interval: weekly }
    commit-message: { prefix: build }
